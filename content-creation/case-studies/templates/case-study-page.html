<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__</title>
<meta name="description" content="__PAGE_DESCRIPTION__">
<!--
  CASE STUDY PAGE TEMPLATE
  Do not edit per case study. build.js fills __DS__ (path to design-system/) and the case data below.
  Layout follows the case study detail page in the Figma file (screenshot archived in the source repository). Rules: case-studies/rules/.
-->
<link rel="stylesheet" href="__DS__tokens/tokens.css">
<link rel="stylesheet" href="__DS__components/bundle.css">
<link rel="stylesheet" href="__DS__components/sections.css">
<style>
  body { margin: 0; background: var(--primary-white); }
  .cs-section { display: grid; gap: 20px; }
  .cs-section + .cs-section { margin-top: 30px; }
  .cs-section h2 { margin: 0; }
  .cd-hero-case__body > p.cd-text:empty { display: none; }
  .cs-intro { display: grid; gap: 20px; margin-bottom: 50px; }
  .cd-article-page__body .cs-intro p { font-size: 20px; line-height: 1.5; }
  .cd-article-page__body .cs-intro .cs-impact-body { font-weight: 700; color: var(--primary-navy); }
  .cs-impact-body { margin: 0; font-family: var(--font-body); font-weight: 700; color: var(--primary-navy); }
  .cs-label { margin: 0; font-family: var(--font-body); font-weight: 700; font-size: 16px; line-height: 1.5; color: var(--primary-navy); }
  .cd-bullets strong { color: var(--primary-navy); }
  .cs-other { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 60px; }
  .cs-arrows { display: flex; gap: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script>window.CodestConfig = { assetBase: "__DS__assets/" };</script>
<script id="case-data" type="application/json">/*__CASE_DATA__*/</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="__DS__components/bundle.js"></script>
<script>
  var h = React.createElement, F = React.Fragment, C = window.Codest;
  var d = JSON.parse(document.getElementById("case-data").textContent);
  var nav = [{ label: "About us", href: "#" }, { label: "Services", href: "#" }, { label: "Our team", href: "#" }, { label: "Case studies", href: "#" }, { label: "Know how", href: "#" }];

  function P(t, i) { return h("p", { key: i, className: "cd-text" }, t); }
  function B(bold, rest) { return { text: h(F, null, h("strong", null, bold), " " + rest) }; }
  function Body(children, top) {
    return h("div", { className: "cd-container" }, h("div", { className: "cd-article-page", style: top === false ? { paddingTop: 80 } : null },
      h("div", { className: "cd-article-page__aside" }),
      h("div", { className: "cd-article-page__body", style: { gap: 0 } }, children)));
  }
  function hq(v) { var i = v.lastIndexOf(","); return i < 0 ? v : h(F, null, v.slice(0, i + 1), h("br"), v.slice(i + 1).trim()); }
  function stat(s) { var plus = /\+$/.test(s.value); return { value: plus ? s.value.slice(0, -1) : s.value, label: s.label, plus: plus }; }

  function Page() {
    var aboutHeading = d.client.named && d.client.name ? "About " + d.client.name : "About the client";
    return h(F, null,
      h("div", { style: { position: "relative" } },
        h("div", { style: { position: "absolute", top: 0, left: 0, right: 0, zIndex: 3 } },
          h(C.Header, { dark: true, links: nav, secondary: { label: "Careers", href: "#" }, primary: { label: "Get in touch", href: "#" } })),
        h(C.HeroCaseStudy, {
          category: d.category,
          title: d.title,
          facts: [
            { label: "Industry", value: d.facts.industry },
            { label: "Headquarters", value: hq(d.facts.headquarters) },
            { label: "Tech stack", value: d.facts.tech_stack }
          ]
        })),

      Body([
        h("div", { key: "intro", className: "cs-intro" },
          h("p", { className: "cd-lead" }, d.problem_hook),
          h("p", { className: "cs-impact-body" }, d.impact_statement)),
        h("section", { key: "about", className: "cs-section" },
          h("h2", null, aboutHeading),
          P(d.about)),
        h("section", { key: "challenge", className: "cs-section" },
          h("h2", null, "Challenge"),
          d.challenge.paragraphs.map(P),
          h("p", { className: "cs-label" }, "Key challenges:"),
          h(C.Bullets, { items: d.challenge.key_challenges.map(function (k) { return B(k.label + ":", k.text); }) }),
          d.challenge.stakes ? P(d.challenge.stakes, "stakes") : null)
      ]),

      d.stats_band && d.stats_band.length ? h(C.StatsBand, { stats: d.stats_band.map(stat) }) : null,

      Body([
        h("section", { key: "project", className: "cs-section" },
          h("h2", null, "Project description"),
          d.project_description.map(P)),
        h("section", { key: "approach", className: "cs-section" },
          h("h2", null, "Approach"),
          d.approach.map(P)),
        h("section", { key: "results", className: "cs-section" },
          h("h2", null, "Results"),
          P(d.results.summary),
          h(C.Bullets, { items: d.results.bullets.map(function (b) { return B(b.bold, b.text); }) })),
        d.quote ? h("section", { key: "opinion", className: "cs-section" },
          h("h2", null, "Client's opinion"),
          h(C.PullQuote, { quote: d.quote.text, name: d.quote.name, role: d.quote.role + (d.quote.company ? ", " + d.quote.company : "") })) : null
      ], d.stats_band && d.stats_band.length ? false : undefined),

      d.other_case ? h(C.Section, { style: { paddingTop: 0 } },
        h("div", { className: "cs-other" }, h("h2", { className: "cd-h2" }, "Other case studies"),
          h("div", { className: "cs-arrows" }, h(C.SliderButton, { direction: "prev" }), h(C.SliderButton, { direction: "next" }))),
        h(C.CasePanel, { category: d.other_case.category, title: d.other_case.title, href: d.other_case.href || "#" })) : h("div", { style: { height: 40 } }),

      h(C.CtaBand, { title: d.cta.title, text: d.cta.text, cta: { label: d.cta.label, href: "#" } }),
      h(C.Footer, {
        newsletterTitle: "Subscribe to our knowledge base and stay up to date on the expertise from the IT sector.",
        consent: "I agree to receive marketing and sales communications from The Codest and to allow The Codest to store and process my personal data as explained in our Privacy Policy.",
        about: "We take responsibility for the systems your business makes money on, as if they were our own.",
        offices: [
          { place: "United Kingdom", address: h(F, null, "Office 303B, 182-184 High Street North E6 2JA", h("br"), "London, England") },
          { place: "Poland", address: h(F, null, "Fabryczna Office Park, Aleja Pokoju 18, 31-564 Krak\u00f3w", h("br"), "Brain Embassy, Konstruktorska 11, 02-673 Warsaw") }
        ],
        columns: [
          { title: "The Codest", links: nav },
          { title: "Services", links: [{ label: "Staff Augmentation", href: "#" }, { label: "Product Development", href: "#" }, { label: "AI Services", href: "#" }] },
          { title: "Know how", links: [{ label: "Blog", href: "#" }, { label: "Meetups", href: "#" }, { label: "Webinars", href: "#" }, { label: "Resources", href: "#" }] }
        ],
        legal: "Privacy policy · Website terms of use",
        copyright: "Copyright \u00a9 2026 The Codest. All rights reserved."
      })
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Page));
</script>
</body>
</html>
