<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story, 9:16 · 1080x1920 · The Codest creative template</title>
<!--
  Story, 9:16 (1080 x 1920px). Instagram, Facebook and LinkedIn stories, Reels covers. Keep everything inside the safe area: the top 250px and bottom 340px are covered by the app.
  Generated by creatives/build_templates.py. Do not edit by hand.
  Fill it with creatives/render.mjs, or open with URL params: ?headline=...&tone=navy (add &guides=1 to see the safe area).
  Fields: cta, eyebrow, headline, photo, text, tone
  Tones: light, white, pink, peach, navy. Default: navy.
-->
<link rel="stylesheet" href="../../design-system/tokens/tokens.css">
<link rel="stylesheet" href="../creatives.css">
<script src="../fill.js"></script>
<style>.cr[data-tone]:not([data-tone="pink"]) [data-tone-only="pink"] { display: none; }</style>
</head>
<body>
<div class="cr" data-template="story" data-tone="navy" style="width:1080px;height:1920px;--k:2.2;--m:80px">
  <span class="cr-wave cr-wave--banner" style="inset:0;opacity:.8"></span>
  <span class="cr-orb cr-orb--purple" style="width:620px;height:620px;right:-260px;top:200px"></span>
  <div class="cr__ui-top" style="top:0;height:250px"></div><div class="cr__ui-bottom" style="bottom:0;height:340px"></div><div class="cr__inner" style="inset:270px 80px 360px 80px">
    <img class="cr-logo cr-logo--dark" src="../../design-system/assets/logo/the-codest-logo-black.svg" alt="The Codest" style="width:240px"><img class="cr-logo cr-logo--light" src="../../design-system/assets/logo/the-codest-logo-white.svg" alt="The Codest" style="width:240px">
    <div class="cr-photo is-empty " style="width:640px;height:500px;align-self:center;margin-top:70px"><img data-field="photo" data-hide="true" alt=""><div class="cr-photo__empty"></div></div>
    <div style="flex:1"></div>
    <p class="cr-eyebrow" data-field="eyebrow" style="font-size:28px;margin-bottom:28px">[Eyebrow]</p>
    <h1 class="cr-headline" data-field="headline" data-max-lines="4" style="font-size:84px">[Headline, six words or fewer]</h1>
    <p class="cr-text" data-field="text" data-max-lines="2" style="font-size:36px;margin-top:32px">[One supporting sentence]</p>
    <div style="margin-top:64px;display:flex"><span class="cr-btn-wrap" style=""><span class="cr-btn" data-field="cta">[Call to action]</span></span></div>
  </div>
</div>
</body>
</html>
