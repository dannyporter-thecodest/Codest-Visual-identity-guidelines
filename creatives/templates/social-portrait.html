<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social post, portrait 4:5 · 1080x1350 · The Codest creative template</title>
<!--
  Social post, portrait 4:5 (1080 x 1350px). LinkedIn and Instagram feed posts where a photo or more text is needed. Takes the most feed space.
  Generated by creatives/build_templates.py. Do not edit by hand.
  Fill it with creatives/render.mjs, or open with URL params: ?headline=...&tone=navy (add &guides=1 to see the safe area).
  Fields: cta, eyebrow, headline, photo, text, tone
  Tones: light, white, pink, peach, navy. Default: light.
-->
<link rel="stylesheet" href="../../design-system/tokens/tokens.css">
<link rel="stylesheet" href="../creatives.css">
<script src="../fill.js"></script>
<style>.cr[data-tone]:not([data-tone="pink"]) [data-tone-only="pink"] { display: none; }</style>
</head>
<body>
<div class="cr" data-template="social-portrait" data-tone="light" style="width:1080px;height:1350px;--k:2;--m:72px">
  <span class="cr-orb cr-orb--purple" style="width:520px;height:520px;left:-240px;top:-220px"></span>
  <span class="cr-wave cr-wave--lines" style="width:640px;height:1100px;right:-140px;top:-80px"></span>
  <div class="cr__inner">
    <img class="cr-logo cr-logo--dark" src="../../design-system/assets/logo/the-codest-logo-black.svg" alt="The Codest" style="width:216px"><img class="cr-logo cr-logo--light" src="../../design-system/assets/logo/the-codest-logo-white.svg" alt="The Codest" style="width:216px">
    <div class="cr-photo is-empty " style="width:600px;height:460px;align-self:flex-end;margin:40px 40px 0 0"><img data-field="photo" data-hide="true" alt=""><div class="cr-photo__empty"></div></div>
    <div style="flex:1"></div>
    <p class="cr-eyebrow" data-field="eyebrow" style="font-size:24px;margin-bottom:24px">[Eyebrow]</p>
    <h1 class="cr-headline" data-field="headline" data-max-lines="4" style="font-size:72px;max-width:900px">[Headline, eight words or fewer]</h1>
    <p class="cr-text" data-field="text" data-max-lines="3" style="font-size:32px;max-width:860px;margin-top:28px">[One or two supporting sentences]</p>
    <div style="margin-top:56px;display:flex"><span class="cr-btn-wrap" style=""><span class="cr-btn" data-field="cta">[Call to action]</span></span></div>
  </div>
</div>
</body>
</html>
