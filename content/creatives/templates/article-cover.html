<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Article and case study cover · 1200x630 · The Codest creative template</title>
<!--
  Article and case study cover (1200 x 630px). Blog article and case study header images, and their social share image.
  Generated by content/creatives/build_templates.py. Do not edit by hand.
  Fill it with content/creatives/render.js, or open with URL params: ?headline=...&tone=navy (add &guides=1 to see the safe area).
  Fields: author, author_photo, author_role, category, headline, tone
  Tones: light, white, pink, peach, navy. Default: pink.
-->
<link rel="stylesheet" href="../../../brand/design-system/tokens/tokens.css">
<link rel="stylesheet" href="../creatives.css">
<script src="../fill.js"></script>
<style>.cr[data-tone]:not([data-tone="pink"]) [data-tone-only="pink"] { display: none; }</style>
</head>
<body>
<div class="cr" data-template="article-cover" data-tone="pink" style="width:1200px;height:630px;--k:1.6;--m:64px">
  <span class="cr-wave cr-wave--lines" style="width:560px;height:900px;right:-120px;top:-160px"></span>
  <span class="cr-orb cr-orb--orange" style="width:380px;height:380px;right:-140px;bottom:-200px"></span>
  <div class="cr__inner">
    <div style="display:flex;justify-content:space-between;align-items:flex-start"><span class="cr-pill" data-field="category">[Category]</span><img class="cr-logo cr-logo--dark" src="../../../brand/design-system/assets/logo/the-codest-logo-black.svg" alt="The Codest" style="width:150px"><img class="cr-logo cr-logo--light" src="../../../brand/design-system/assets/logo/the-codest-logo-white.svg" alt="The Codest" style="width:150px"></div>
    <div style="flex:1"></div>
    <h1 class="cr-headline" data-field="headline" data-max-lines="3" style="font-size:56px;max-width:900px">[Article title on up to three lines]</h1>
    <div class="cr-person" style="margin-top:36px">
      <img class="cr-person__img" data-field="author_photo" data-hide="true" alt="">
      <div><div class="cr-person__name" data-field="author">[Author name]</div><div class="cr-person__role" data-field="author_role">[Role]</div></div>
    </div>
  </div>
</div>
</body>
</html>
