<!doctype html>
<html lang="en">
<head>

<title>Social post, square · 1080x1080 · The Codest creative template</title>
<!--
  Social post, square (1080 x 1080px). LinkedIn, Instagram and Meta feed posts. Statements, announcements, hiring, content promotion.
  Generated by content/creatives/build_templates.py. Do not edit by hand.
  Fill it with content/creatives/render.js, or open with URL params: ?headline=...&tone=navy (add &guides=1 to see the safe area).
  Fields: cta, eyebrow, headline, text, tone
  Tones: light, white, pink, peach, navy. Default: light.
-->
<link rel="stylesheet" href="../../../brand/design-system/tokens/tokens.css">
<link rel="stylesheet" href="../creatives.css">
<script src="../fill.js"></script>
<style>.cr[data-tone]:not([data-tone="pink"]) [data-tone-only="pink"] { display: none; }</style>
</head>
<body>
<div class="cr" data-template="social-square" data-tone="light" style="width:1080px;height:1080px;--k:2;--m:72px">
  <span class="cr-orb cr-orb--purple" style="width:560px;height:560px;right:-220px;top:-240px"></span>
  <span class="cr-wave cr-wave--rings" style="width:760px;height:620px;right:-260px;bottom:-150px"></span>
  <div class="cr__inner">
    <img class="cr-logo cr-logo--dark" src="../../../brand/design-system/assets/logo/the-codest-logo-black.svg" alt="The Codest" style="width:216px"><img class="cr-logo cr-logo--light" src="../../../brand/design-system/assets/logo/the-codest-logo-white.svg" alt="The Codest" style="width:216px">
    <div style="flex:1"></div>
    <p class="cr-eyebrow" data-field="eyebrow" style="font-size:24px;margin-bottom:24px">[Eyebrow]</p>
    <h1 class="cr-headline" data-field="headline" data-max-lines="4" style="font-size:76px;max-width:880px">[Headline, eight words or fewer]</h1>
    <p class="cr-text" data-field="text" data-max-lines="2" style="font-size:32px;max-width:820px;margin-top:28px">[One supporting sentence]</p>
    <div style="margin-top:56px;display:flex"><span class="cr-btn-wrap" style=""><span class="cr-btn" data-field="cta">[Call to action]</span></span></div>
  </div>
</div>
