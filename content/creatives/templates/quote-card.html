<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quote card · 1080x1080 · The Codest creative template</title>
<!--
  Quote card (1080 x 1080px). Client or employee quotes on social. Only cleared quotes with approved attribution. Pink tone adds the gradient bar used on pull quotes.
  Generated by content/creatives/build_templates.py. Do not edit by hand.
  Fill it with content/creatives/render.js, or open with URL params: ?headline=...&tone=navy (add &guides=1 to see the safe area).
  Fields: name, photo, quote, role, tone
  Tones: light, white, pink, peach, navy. Default: navy.
-->
<link rel="stylesheet" href="../../../brand/design-system/tokens/tokens.css">
<link rel="stylesheet" href="../creatives.css">
<script src="../fill.js"></script>
<style>.cr[data-tone]:not([data-tone="pink"]) [data-tone-only="pink"] { display: none; }</style>
</head>
<body>
<div class="cr" data-template="quote-card" data-tone="navy" style="width:1080px;height:1080px;--k:2;--m:80px">
  <span class="cr-bar" data-tone-only="pink"></span>
  <img class="cr-quote-mark" src="../../../brand/design-system/assets/icons/quote-mark.svg" alt="" style="left:80px;top:120px;width:220px">
  <span class="cr-wave cr-wave--rings" style="width:700px;height:560px;right:-280px;bottom:-200px"></span>
  <div class="cr__inner">
    <div style="flex:1"></div>
    <p class="cr-text" data-field="quote" data-max-lines="7" style="font-size:46px;line-height:1.4;font-style:italic;max-width:880px;color:inherit">[Quote, under 40 words]</p>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:56px">
      <div class="cr-person">
        <img class="cr-person__img" data-field="photo" data-hide="true" alt="">
        <div><div class="cr-person__name" data-field="name">[Name]</div><div class="cr-person__role" data-field="role">[Role, Company]</div></div>
      </div>
      <img class="cr-logo cr-logo--dark" src="../../../brand/design-system/assets/logo/the-codest-logo-black.svg" alt="The Codest" style="width:180px"><img class="cr-logo cr-logo--light" src="../../../brand/design-system/assets/logo/the-codest-logo-white.svg" alt="The Codest" style="width:180px">
    </div>
  </div>
</div>
</body>
</html>
