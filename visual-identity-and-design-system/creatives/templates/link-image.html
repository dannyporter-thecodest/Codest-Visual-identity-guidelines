<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link image / Open Graph · 1200x627 · The Codest creative template</title>
<!--
  Link image / Open Graph (1200 x 627px). Shared links on LinkedIn, X, Slack and messengers; Open Graph image for web pages; LinkedIn sponsored single-image ads.
  Generated by creatives/build_templates.py. Do not edit by hand.
  Fill it with creatives/render.mjs, or open with URL params: ?headline=...&tone=navy (add &guides=1 to see the safe area).
  Fields: eyebrow, headline, photo, tone
  Tones: light, white, pink, peach, navy. Default: white.
-->
<link rel="stylesheet" href="../../design-system/tokens/tokens.css">
<link rel="stylesheet" href="../creatives.css">
<script src="../fill.js"></script>
<style>.cr[data-tone]:not([data-tone="pink"]) [data-tone-only="pink"] { display: none; }</style>
</head>
<body>
<div class="cr" data-template="link-image" data-tone="white" style="width:1200px;height:627px;--k:1.6;--m:56px">
  <span class="cr-orb cr-orb--purple" style="width:420px;height:420px;right:-160px;top:-180px"></span>
  <span class="cr-wave cr-wave--rings" style="width:620px;height:500px;right:-170px;bottom:-140px"></span>
  <div class="cr__inner">
    <img class="cr-logo cr-logo--dark" src="../../design-system/assets/logo/the-codest-logo-black.svg" alt="The Codest" style="width:176px"><img class="cr-logo cr-logo--light" src="../../design-system/assets/logo/the-codest-logo-white.svg" alt="The Codest" style="width:176px">
    <div style="flex:1"></div>
    <p class="cr-eyebrow" data-field="eyebrow" style="font-size:20px;margin-bottom:18px">[Eyebrow]</p>
    <h1 class="cr-headline" data-field="headline" data-max-lines="3" style="font-size:58px;max-width:700px">[Headline, eight words or fewer]</h1>
    <div class="cr-photo is-empty cr-photo--purple" style="position:absolute;right:30px;top:80px;width:330px;height:380px"><img data-field="photo" data-hide="true" alt=""><div class="cr-photo__empty"></div></div>
  </div>
</div>
</body>
</html>
