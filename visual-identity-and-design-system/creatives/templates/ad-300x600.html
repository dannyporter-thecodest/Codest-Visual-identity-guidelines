<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Display ad, half page · 300x600 · The Codest creative template</title>
<!--
  Display ad, half page (300 x 600px). Google Display and programmatic half page.
  Generated by creatives/build_templates.py. Do not edit by hand.
  Fill it with creatives/render.mjs, or open with URL params: ?headline=...&tone=navy (add &guides=1 to see the safe area).
  Fields: cta, eyebrow, headline, text, tone
  Tones: light, white, pink, peach, navy. Default: navy.
-->
<link rel="stylesheet" href="../../design-system/tokens/tokens.css">
<link rel="stylesheet" href="../creatives.css">
<script src="../fill.js"></script>
<style>.cr[data-tone]:not([data-tone="pink"]) [data-tone-only="pink"] { display: none; }</style>
</head>
<body>
<div class="cr" data-template="ad-300x600" data-tone="navy" style="width:300px;height:600px;--k:0.9;--m:24px">
  <span class="cr-wave cr-wave--banner" style="inset:0"></span>
  <span class="cr-orb cr-orb--purple" style="width:240px;height:240px;right:-110px;top:-90px"></span>
  <div class="cr__inner">
    <img class="cr-logo cr-logo--dark" src="../../design-system/assets/logo/the-codest-logo-black.svg" alt="The Codest" style="width:110px"><img class="cr-logo cr-logo--light" src="../../design-system/assets/logo/the-codest-logo-white.svg" alt="The Codest" style="width:110px">
    <div style="flex:1"></div>
    <p class="cr-eyebrow" data-field="eyebrow" style="font-size:12px;margin-bottom:12px">[Eyebrow]</p>
    <h1 class="cr-headline" data-field="headline" data-max-lines="5" style="font-size:32px;line-height:1.2">[Headline, eight words max]</h1>
    <p class="cr-text" data-field="text" data-max-lines="3" style="font-size:15px;margin-top:14px">[One short sentence]</p>
    <div style="margin-top:24px;display:flex"><span class="cr-btn-wrap" style=""><span class="cr-btn" data-field="cta">[CTA]</span></span></div>
  </div>
</div>
</body>
</html>
