<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn page banner · 1584x396 · The Codest creative template</title>
<!--
  LinkedIn page banner (1584 x 396px). LinkedIn company page and employee profile background. The page logo or profile photo covers the bottom-left, so content sits on the right. No wordmark: the page already shows it.
  Generated by creatives/build_templates.py. Do not edit by hand.
  Fill it with creatives/render.mjs, or open with URL params: ?headline=...&tone=navy (add &guides=1 to see the safe area).
  Fields: headline, text, tone
  Tones: light, white, pink, peach, navy. Default: navy.
-->
<link rel="stylesheet" href="../../design-system/tokens/tokens.css">
<link rel="stylesheet" href="../creatives.css">
<script src="../fill.js"></script>
<style>.cr[data-tone]:not([data-tone="pink"]) [data-tone-only="pink"] { display: none; }</style>
</head>
<body>
<div class="cr" data-template="linkedin-banner" data-tone="navy" style="width:1584px;height:396px;--k:1.4;--m:48px">
  <span class="cr-wave cr-wave--banner" style="inset:0"></span>
  <span class="cr-orb cr-orb--purple" style="width:420px;height:420px;left:200px;top:-260px"></span>
  <span class="cr-orb cr-orb--orange" style="width:360px;height:360px;right:-120px;bottom:-240px"></span>
  <div class="cr__inner" style="inset:48px 72px 48px 600px">
    <div style="flex:1"></div>
    <h1 class="cr-headline" data-field="headline" data-max-lines="1" style="font-size:44px;text-align:right">[Company line, one sentence]</h1>
    <p class="cr-text" data-field="text" data-max-lines="1" style="font-size:22px;text-align:right;margin-top:14px">[Optional second line]</p>
    <div style="flex:1"></div>
  </div>
</div>
</body>
</html>
