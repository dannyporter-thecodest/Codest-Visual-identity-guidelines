<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Email header · 1200x400 · The Codest creative template</title>
<!--
  Email header (1200 x 400px). Newsletter and campaign email header. Exported at 1200x400, displayed at 600x200 in the email.
  Generated by creatives/build_templates.py. Do not edit by hand.
  Fill it with creatives/render.mjs, or open with URL params: ?headline=...&tone=navy (add &guides=1 to see the safe area).
  Fields: headline, tone
  Tones: light, white, pink, peach, navy. Default: light.
-->
<link rel="stylesheet" href="../../design-system/tokens/tokens.css">
<link rel="stylesheet" href="../creatives.css">
<script src="../fill.js"></script>
<style>.cr[data-tone]:not([data-tone="pink"]) [data-tone-only="pink"] { display: none; }</style>
</head>
<body>
<div class="cr" data-template="email-header" data-tone="light" style="width:1200px;height:400px;--k:1.4;--m:56px">
  <span class="cr-orb cr-orb--purple" style="width:420px;height:420px;right:-120px;top:-200px"></span>
  <span class="cr-wave cr-wave--rings" style="width:620px;height:500px;right:-150px;bottom:-200px"></span>
  <div class="cr__inner">
    <img class="cr-logo cr-logo--dark" src="../../design-system/assets/logo/the-codest-logo-black.svg" alt="The Codest" style="width:180px"><img class="cr-logo cr-logo--light" src="../../design-system/assets/logo/the-codest-logo-white.svg" alt="The Codest" style="width:180px">
    <div style="flex:1"></div>
    <h1 class="cr-headline" data-field="headline" data-max-lines="2" style="font-size:52px;max-width:820px">[Email headline]</h1>
  </div>
</div>
</body>
</html>
