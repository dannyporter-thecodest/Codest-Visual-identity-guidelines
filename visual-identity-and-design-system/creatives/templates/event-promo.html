<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Webinar and meetup promo · 1080x1080 · The Codest creative template</title>
<!--
  Webinar and meetup promo (1080 x 1080px). Webinar, meetup and event announcements on social. Pair with link-image for the registration link.
  Generated by creatives/build_templates.py. Do not edit by hand.
  Fill it with creatives/render.mjs, or open with URL params: ?headline=...&tone=navy (add &guides=1 to see the safe area).
  Fields: cta, date, headline, label, time, people[], tone
  Tones: light, white, pink, peach, navy. Default: navy.
-->
<link rel="stylesheet" href="../../design-system/tokens/tokens.css">
<link rel="stylesheet" href="../creatives.css">
<script src="../fill.js"></script>
<style>.cr[data-tone]:not([data-tone="pink"]) [data-tone-only="pink"] { display: none; }</style>
</head>
<body>
<div class="cr" data-template="event-promo" data-tone="navy" style="width:1080px;height:1080px;--k:2;--m:72px">
  <span class="cr-wave cr-wave--banner" style="inset:0"></span>
  <span class="cr-orb cr-orb--purple" style="width:520px;height:520px;right:-220px;top:-220px"></span>
  <div class="cr__inner">
    <div style="display:flex;justify-content:space-between;align-items:center"><img class="cr-logo cr-logo--dark" src="../../design-system/assets/logo/the-codest-logo-black.svg" alt="The Codest" style="width:200px"><img class="cr-logo cr-logo--light" src="../../design-system/assets/logo/the-codest-logo-white.svg" alt="The Codest" style="width:200px"><span class="cr-pill" data-field="label">[Webinar]</span></div>
    <div style="flex:1"></div>
    <h1 class="cr-headline" data-field="headline" data-max-lines="3" style="font-size:66px">[Event title on up to three lines]</h1>
    <div class="cr-meta" style="margin-top:36px">
      <span><img src="../../design-system/assets/icons/calendar.svg" alt=""><b data-field="date">[Date]</b></span>
      <span><img src="../../design-system/assets/icons/time.svg" alt=""><b data-field="time">[Time, timezone]</b></span>
    </div>
    <div class="cr-people" data-list="people" style="margin-top:48px">
      <div class="cr-person" data-item><img class="cr-person__img" alt=""><div><div class="cr-person__name" data-sub="name">[Speaker]</div><div class="cr-person__role" data-sub="role">[Role]</div></div></div>
    </div>
    <div style="margin-top:56px;display:flex"><span class="cr-btn-wrap" style=""><span class="cr-btn" data-field="cta">[Register]</span></span></div>
  </div>
</div>
</body>
</html>
